<!--
  Dom: the front end for Simon's vault (Simon, 17 Oct 2026: "make sure the app is the Control Centre... build it
  as the front end for the whole Dom vault, so we can build on it as required in the future. Robust, quick").

  How it's built (read this before adding to it):
  - Views. Each screen is a view registered with Dom.view(name, {match, render}); the router maps the URL hash
    to a view (#/ the Control Centre, #/p/<vault path> a paper). A new screen is one more Dom.view(...) call.
  - Data. Everything comes from the private repo simonjackson1911/todo-data (to-do.md, the Control Centre and
    every paper it links to), which todo-sync on the iMac fills from the vault. Reads are cache-first: the last
    copy shows at once, then GitHub is asked only "has it changed?" (ETag), so a refresh costs almost nothing.
  - Writes. Every change is an operation on to-do.md, saved on the device first (pending) and pushed in order;
    a clash with the Mac re-reads and re-applies; no signal means it waits and retries. The vault stays the
    record (AGENTS.md); this app never writes anything else.
  - The Control Centre page carries no script (AGENTS.md); this app adds its behaviour inside a sandboxed frame
    (ccInside) and turns each tap into one of the operations above.
  - The token lives only in this device's app storage, never in the vault (hard stop 2). Storage keys start
    "dom-app-": the old to-do app shares this web address (simonjackson1911.github.io), so its keys must not be reused.
  - The Journal (#/j) reads its own private repo, journal-data, with the same token; see "Journal" below.
  - Tests can swap the network for files: set window.DOM_TEST_IO = {get(path), put(path,text,sha,msg)}
    (and jget(path, binary) for the Journal).
  Source: system/dom-app/ in the vault; published with update-dom (system/scripts/publish-dom-app.sh).
-->
<style>
:root{
  --bg:#ffffff; --fg:#1b1b1f; --muted:#6b6b73; --line:#e6e6ea; --card:#ffffff;
  --cardfg:#1b1b1f; --accent:#4f6bd8; --sheet:#ffffff; --chip:rgba(255,255,255,.18);
  --input:#f2f2f5; --danger:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111114; --fg:#f1f1f4; --muted:#9a9aa3; --line:#26262c; --card:#1e1e23;
    --cardfg:#f1f1f4; --accent:#8ea2ff; --sheet:#1a1a1f; --input:#26262c; --danger:#ff7b6b; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;overflow-x:clip;max-width:100%;background:var(--bg);color:var(--fg);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--fg)}
.view{display:none;min-height:100vh;min-height:100dvh}
.view.on{display:block}

/* Home */
#home{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px)}
.hdr{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex:none}
.hdr h1{font-size:22px;margin:0;flex:1;font-weight:650}
.iconbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.iconbtn svg{width:24px;height:24px}
.row{display:flex;align-items:center;gap:16px;padding:13px 4px;width:100%;text-align:left}
.row .ico{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center}
.row .ico svg{width:26px;height:26px}
.row .name{flex:1;font-size:19px}
.row .count{color:var(--muted);font-size:16px}
.sep{height:1px;background:var(--line);margin:10px 0}
.group .ghead{display:flex;align-items:center;gap:16px;padding:14px 4px;width:100%}
.group .ghead .ico{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.group .ghead .ico svg{width:24px;height:24px}
.group .ghead .name{flex:1;font-weight:650;font-size:19px;text-align:left}
.group .ghead .chev{transition:transform .2s;color:var(--muted)}
.group.closed .ghead .chev{transform:rotate(-90deg)}
.group .glists{margin-left:14px;padding-left:14px;border-left:2px solid var(--line)}
.group.closed .glists{display:none}
.group .ghead .gopen{display:flex;align-items:center;gap:16px;flex:1;min-width:0;padding:0;background:none;border:0;color:inherit;font:inherit;text-align:left}
.group .ghead .gfold{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;margin:-10px -4px -10px 0;background:none;border:0;color:inherit}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
.foot button{color:var(--accent);font-size:13px;margin-left:8px}

/* List */
#list{background:var(--lbg,#5b6fc7);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 40px)}
.ltop{display:flex;align-items:center;justify-content:space-between;height:44px}
.back{display:flex;align-items:center;gap:2px;font-size:18px;color:#fff}
.back svg{width:26px;height:26px}
#list h2{font-size:38px;font-weight:750;margin:6px 6px 14px;letter-spacing:-.5px}
.chips{display:flex;gap:8px;margin:0 4px 12px}
.chip{background:var(--chip);color:#fff;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600}
.card{display:flex;align-items:flex-start;gap:14px;background:var(--card);color:var(--cardfg);
  border-radius:10px;padding:15px 14px;margin-bottom:5px;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.sw{position:relative;margin-bottom:5px;border-radius:10px;overflow:hidden;background:var(--card)}
.sw .card{margin-bottom:0;position:relative;z-index:1;touch-action:pan-y;transition:transform .2s ease}
.sw.dragging .card{transition:none}
.sw-l,.sw-r{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:10px;padding:0 10px}
.sw-l{left:0}.sw-r{right:0}
.sw-btn{width:72px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;color:#fff}
.sw-btn svg{width:24px;height:24px}
.sw-btn.sun{background:#3b6cf0}.sw-btn.mv{background:#f0a223}.sw-btn.del{background:#e5484d}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid #8a8a92;flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:#fff}
.tick svg{width:16px;height:16px;opacity:0}
.card.done .tick{background:var(--lbg,#5b6fc7);border-color:var(--lbg,#5b6fc7)}
.card.done .tick svg{opacity:1}
.card.done .ttl{text-decoration:line-through;color:var(--muted)}
.cbody{flex:1;min-width:0}
.ttl{font-size:17px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:13px;color:var(--muted);margin-top:3px}
.sub .wt{display:inline-flex;align-items:center;gap:4px;background:#fdf0dc;color:#9a5a12;font-weight:600;font-size:12px;border-radius:10px;padding:2px 8px 2px 6px;vertical-align:1px}
.sub .wt svg{width:13px;height:13px}
@media (prefers-color-scheme: dark){.sub .wt{background:#3a2a14;color:#f0b366}}
.sub .od{color:var(--danger)}
.handle{display:flex;align-items:center;justify-content:center;width:48px;align-self:stretch;margin:-15px -14px -15px 0;font-size:26px;color:#8a8a92;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.reorder .rcol{align-self:stretch}
.sw.lift{box-shadow:0 12px 28px rgba(0,0,0,.28);z-index:6;transition:box-shadow .15s;will-change:transform}
.sw.shift{transition:transform .18s ease;will-change:transform}
.donebtn{color:#fff;font-weight:650;font-size:17px;padding:0 8px}
button.chip{border:0}
.rvrow .apyes{color:#1f6f43;font-weight:650}
.rvrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.rvrow button{background:var(--input);border-radius:14px;padding:5px 11px;font-size:13px;font-weight:600}
.rvrow .rvdrop{color:var(--danger)}
.rcol{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.wbadge{display:flex;flex-direction:column;align-items:center;gap:1px;color:#b0681a;padding:2px 4px;border-radius:8px;background:#fdf0dc;min-width:34px}
.sbadge{display:flex;flex-direction:column;align-items:center;gap:2px;color:#2f5ea8;padding:3px 5px;border-radius:8px;background:#e3ecfb;min-width:34px;font-size:10px;font-weight:700;line-height:1}
@media (prefers-color-scheme: dark){.sbadge{background:#1c2c48;color:#8fb4f0}}
.wbadge svg{width:16px;height:16px}.wbadge span{font-size:11px;font-weight:700;line-height:1}
@media (prefers-color-scheme: dark){.wbadge{background:#3a2a14;color:#f0b366}}
.star{width:28px;height:28px;flex:none;color:var(--lbg,#5b6fc7);display:flex;align-items:center;justify-content:center}
.star svg{width:24px;height:24px}
.star.off{color:#9a9aa3}
.section{color:#fff;font-weight:650;font-size:15px;margin:16px 6px 8px;display:flex;align-items:center;gap:6px}
.empty{color:rgba(255,255,255,.85);text-align:center;margin:40px 20px;font-size:16px}
.addbar{position:fixed;z-index:15;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);
  background:rgba(0,0,0,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 16px;height:58px;color:#fff}
.addbar svg{width:26px;height:26px;flex:none}
.addbar input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:17px}
.addprev{display:none;position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:16;background:rgba(0,0,0,.72);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px}
.addprev.on{display:block}
.qa-prev{font-size:14px;color:var(--accent);margin:-8px 0 8px;min-height:18px}
.addgo{display:none;background:#fff;color:#2b3a8a;border-radius:9px;padding:7px 12px;font-weight:650;font-size:15px;flex:none}
.addgo.on{display:block}
.addbar input::placeholder{color:rgba(255,255,255,.9)}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--sheet);
  color:var(--fg);border-radius:16px 16px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);
  transform:translateY(105%);transition:transform .22s ease;z-index:21}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 14px}
.wsum{display:flex;align-items:center;gap:10px;background:#fdf0dc;color:#7a4510;border-radius:10px;padding:10px 12px;margin:8px 0 6px;font-size:15px}
.wsum svg{width:20px;height:20px;flex:none}
@media (prefers-color-scheme: dark){.wsum{background:#3a2a14;color:#f0c890}}
.closex{display:block;margin-left:auto;color:var(--accent);font-size:16px;padding:2px 0 8px 12px}
.sheet h3{margin:0 0 6px;font-size:21px;line-height:1.3}
.d-title{display:block;width:100%;min-height:0;border:0;background:transparent;resize:none;font-size:21px;font-weight:650;line-height:1.3;padding:0;margin:0 0 6px;outline:0;overflow:hidden;color:var(--fg)}
.d-notes{display:block;width:100%;border:0;background:var(--input);border-radius:10px;resize:none;font-size:15px;line-height:1.4;padding:10px;margin:6px 0 14px;outline:0;overflow:hidden;min-height:44px;color:var(--fg)}
.notes{color:var(--muted);font-size:15px;white-space:pre-wrap;margin:6px 0 12px}
.meta{font-size:13px;color:var(--muted);margin-bottom:14px}
.bigmove{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:12px 0 6px;padding:16px;border-radius:14px;background:var(--accent);color:#fff;font-size:19px;font-weight:700}
.bigmove svg{width:24px;height:24px}
.bigmove .help{color:rgba(255,255,255,.85);font-weight:400;font-size:15px}
.mvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.mvgrid.two{grid-template-columns:repeat(2,1fr)}
.mvgrid button{background:var(--input);color:var(--fg);border-radius:12px;padding:15px 8px;font-size:17px;text-align:center}
.mvgrid button.on{background:var(--accent);color:#fff;font-weight:700}
.mvlab{font-size:14px;color:var(--muted);margin-top:6px}
.more summary{padding:13px 2px;border-top:1px solid var(--line);font-size:15px;color:var(--muted);list-style:none}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:13px 2px;border-top:1px solid var(--line);text-align:left;font-size:17px}
.act svg{width:22px;height:22px;color:var(--accent);flex:none}
.act input[type=date]{margin-left:auto;background:var(--input);border:0;border-radius:8px;padding:6px 8px}
.seg{display:flex;background:var(--input);border-radius:9px;padding:3px;margin-left:auto}
.seg button{padding:6px 8px;border-radius:7px;font-size:14px}
.seg button.on{background:var(--sheet);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.links a{display:block;color:var(--accent);text-decoration:none;padding:6px 0;font-size:15px}
.danger{color:var(--danger)}
textarea{width:100%;min-height:150px;background:var(--input);border:0;border-radius:10px;padding:10px;font-size:15px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;background:var(--input);border:0;border-radius:10px;padding:11px}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border-radius:12px;padding:13px;font-weight:600;margin-top:14px;text-align:center}
.btn.ghost{background:var(--input);color:var(--fg)}
.help{font-size:13px;color:var(--muted)}
.cscrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:30}
.cscrim.on{display:block}
.compose{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--sheet);color:var(--fg);border-radius:14px 14px 0 0;
  padding:10px 12px 10px;box-shadow:0 -6px 24px rgba(0,0,0,.18);display:none}
.compose.on{display:block}
.compose.kbup{border-radius:14px;left:6px;right:6px;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.cp-top{display:flex;align-items:flex-end;gap:8px}
.cp-head{display:flex;justify-content:flex-end;margin:-4px -4px 6px}.cp-x{width:36px;height:36px;border-radius:50%;background:var(--input);color:var(--muted);font-size:22px;line-height:36px;text-align:center}
.cp-top textarea{flex:1;min-height:0;border:0;background:var(--input);border-radius:12px;padding:12px 14px;font-size:18px;line-height:1.35;resize:none;outline:0;height:96px;color:var(--fg)}
.cp-add{flex:none;background:var(--accent);color:#fff;border-radius:12px;padding:0 18px;height:48px;font-size:17px;font-weight:700}
.cp-note{font-size:13px;color:var(--muted);margin:8px 2px 2px}
.cp-send{width:38px;height:38px;border-radius:50%;background:var(--line);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;margin-bottom:2px}
.cp-send.on{background:var(--accent)}
.cp-send svg{width:20px;height:20px}
.cp-prev{font-size:13px;color:var(--muted);margin:7px 2px 8px;min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-prev.live{color:var(--accent);font-weight:600}
.cp-row{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.cp-row::-webkit-scrollbar{display:none}
.cp-chip{flex:none;display:flex;align-items:center;gap:5px;background:var(--input);border-radius:16px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--fg)}
.cp-chip svg{width:16px;height:16px}
.cp-chip.on{background:var(--accent);color:#fff}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);background:#222;color:#fff;
  border-radius:12px;padding:12px 14px;font-size:15px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.toast{display:flex;align-items:center;gap:12px}.toast span{flex:1}
.toast.act{pointer-events:none}
/* Undo as a small pill in the corner that taps pass through (Simon, 23 Oct 2026: "I have to wait for the Completed
   and Undo... can you think of a better solution so I can go through quickly?"); only the button takes a tap */
.toast.act{left:auto;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);padding:7px 8px 7px 14px;border-radius:999px;font-size:13.5px;gap:8px;max-width:70%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast.act span{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.act #undo{pointer-events:auto;background:#fff;color:#222;border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13.5px}
#undo{color:#8ea2ff;font-weight:650;font-size:16px;padding:4px 2px}
.searchbox{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.searchbox input{flex:1;background:var(--input);border:0;border-radius:10px;padding:11px 12px;outline:0}
#cc{padding:calc(env(safe-area-inset-top) + 6px) 0 0;background:#0f2340}
/* A navy strip behind the clock and the Dom bar (Simon, 27 Oct 2026: the top looked blurred; iOS lays a frosted fade
   over the status bar that shows on white and vanishes on navy). The status bar is see-through with white text, so
   every screen gets the navy strip under the clock. */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#0f2340;z-index:200;pointer-events:none}
#cc .cctop{background:#0f2340;color:#fff;border-bottom:0}
#cc .cctop .iconbtn,#cc .cctop .back,#cc .ccname{color:#fff!important}
#cc .ccstamp{color:#b9c6dd}
.cctop{display:flex;align-items:center;gap:8px;padding:0 8px 6px;position:relative;z-index:2;background:var(--bg);border-bottom:1px solid var(--line,rgba(127,127,127,.3))} /* a crisp line, no soft shadow under the bar (Simon, 27 Oct 2026: "a slight blurring... make that crisp") */
/* Mac web app (Add to Dock): the window buttons sit over the top-left of the page, so the top bars start to the right of them (Simon, 24 Oct 2026) */
/* The Mac app's title bar strip is the window's drag area: a button inside it can't be clicked (Simon, 27 Oct 2026: "I can't get back to the control centre using the back arrow at the top left"). Start the page below it. */.macapp #cc{padding-top:34px}.macapp .ccframe{height:calc(100dvh - 90px)}.macapp #list,.macapp #home,.macapp #search{padding-top:40px}.macapp .jtop{padding-top:34px}
.cctop .back{flex:none}.ccstamp{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.ccframe{display:block;width:100%;border:0;height:calc(100dvh - env(safe-area-inset-top) - 56px);background:#fff}
.plusbtn{background:var(--accent);color:#fff;border-radius:50%;width:36px;height:36px;margin-left:4px}
.plusbtn svg{width:20px;height:20px}
.qa-text{min-height:64px;font-size:17px}
.qa-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.qa-lab{font-size:15px;color:var(--muted);width:44px;flex:none}
.qa-row .seg{margin-left:0}
.qa-row .seg button{padding:6px 7px}
.qa-chips{display:flex;flex-wrap:wrap;gap:6px}
.qa-chip{background:var(--input);border-radius:16px;padding:6px 11px;font-size:14px}
.qa-chip.on{background:var(--accent);color:#fff}
.qa-tog{display:flex;align-items:center;gap:6px;font-size:15px;margin-right:16px}
#search{padding:calc(env(safe-area-inset-top) + 14px) 12px 40px}
#search .card{border:1px solid var(--line)}
.ccname{font-weight:800;font-size:19px;letter-spacing:-.2px;color:var(--accent);padding:0 4px}
/* Journal (system/dom-app/journal-spec.md; Simon, 24 Oct 2026). The look follows Day One (Simon, 24 Oct 2026):
   the journal's blue band, the date column, pinned entries, tags, and a calendar with the days written in blue. */
#jn{--jc:#1f88d0;--jct:#1773b5;--jcs:rgba(31,136,208,.11);background:var(--bg);padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
@media (prefers-color-scheme: dark){ #jn{--jc:#1b6fa8;--jct:#6cbcf2;--jcs:rgba(108,188,242,.15)} }

<body>

<section id="cc" class="view on"></section>
<section id="jn" class="view"></section>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="cscrim" id="cscrim"></div>
<div class="compose" id="compose"></div>

<script>
// Mac web app only: Safari's Add to Dock window, not the iPhone or iPad (an iPad reports MacIntel but has touch points)
(function(){var s=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;if(s&&/Mac/.test(navigator.platform)&&!(navigator.maxTouchPoints>0))document.documentElement.classList.add("macapp");})();
"use strict";
/* ---------- Config ---------- */
const TAGS = {inbox:"Inbox", search:"Job search", MOHARA:"MOHARA", OMMANI:"OMMANI", home:"Home",
  personal:"Personal", files:"Mac and files", system:"Dom", none:"Tasks"}; // system is the Dom list (Simon, 10 Oct)
const TAG_ORDER = ["inbox","search","MOHARA","OMMANI","personal","system","files","none"];
const GROUPS = ["Now","Next","Later"]; // Someday folded into Later (Simon, 29 Oct 2026); a Someday heading or move reads as Later
const APP_VERSION = "dom-2026-10-30h";
const SKEY = "dom-app-settings", CKEY = "dom-app-cache", OKEY = "dom-app-open";

function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ if(v===undefined) return null;
    // Full (a phone allows about 5 MB): drop the copies of papers and their ETags, which are re-fetched on demand, then try once more (Simon, 24 Oct 2026: Training stuck on Loading on the phone only)
    try{ Object.keys(localStorage).forEach(x=>{ if(x!==k && (x.startsWith("dom-app-etag:") || x.startsWith("dom-app-cc:"))) localStorage.removeItem(x); });
      localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e2){ return false; } } }
const MEM={}; // the pages fetched this session, so a page shows even when the device can't keep a copy
let settings = Object.assign({repo:"simonjackson1911/todo-data", branch:"main", path:"to-do.md", vault:"Work", token:""}, store(SKEY)||{}); // the repository is filled in (it isn't secret); only the token is typed on each device
let state = {base:"", text:"", sha:"", items:[], fetched:0};
let route = {view:"cc"};

/* ---------- Dates (phone's local time) ---------- */
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return iso(new Date()); }
function nice(s){ const d=new Date(s+"T12:00:00"); return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); }

/* ---------- Parse to-do.md ---------- */
const ITEM_RE = /^- \[( |x|X)\] (.*)$/;
function tagOf(body){
  const all=[...body.matchAll(/`([A-Za-z]+)`/g)].filter(m=>TAGS[m[1]] && m[1]!=="none");
  return all.length ? all[all.length-1] : null;
}
function plain(s){
  return s.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,"$2").replace(/\[\[([^\]]+)\]\]/g,(m,p)=>p.split("/").pop())
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,"$1").replace(/\*\*/g,"").replace(/`/g,"").replace(/\s+/g," ").trim();
}
// Someday is Later now (Simon, 29 Oct 2026): a stray "## Someday" heading, or a move or add queued by an older copy of the app, lands in Later
function asGroup(g){ return g==="Someday" ? "Later" : g; }
function parse(text){
  const lines=text.split("\n"), items=[]; let group=null, sub=null;
  lines.forEach((ln,i)=>{
    let m;
    if((m=ln.match(/^## (.+)$/))){ group=asGroup(m[1].trim()); sub=null; return; }
    if((m=ln.match(/^#{3,4} (.+)$/))){ sub=m[1].trim(); return; }
    if(!GROUPS.includes(group)) return;
    if(!(m=ln.match(ITEM_RE))) return;
    const body=m[2];
    const tm=tagOf(body);
    const tag=tm?(tm[1]==="home"?"personal":tm[1]):"none"; // home is folded into personal (Simon, 14 Oct 2026)
    const content=tm?body.slice(0,tm.index):body;
    const after=tm?body.slice(tm.index+tm[0].length):"";
    const links=[];
    for(const lm of body.matchAll(/\[([^\]]+)\]\(([^)]+)\)/g)) links.push({label:lm[1], path:lm[2]});
    for(const lm of body.matchAll(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g)) links.push({label:lm[2]||lm[1].split("/").pop(), path:lm[1]});
    let c=content.replace(/\[(id|due|event|today|added|waiting|reviewed|started|prep|meeting|papers|left): [^\]]+\]/g,"").replace(/\[quick\]/g,"").replace(/\[ask\]/g,"").replace(/\[(approved|rejected): [^\]]+\]/g,"").replace(/⭐/g,"").trim();
    let title, notes="";
    const bm=c.match(/^\*\*(.+?)\*\*\s*(.*)$/s);
    if(bm){ title=plain(bm[1]).replace(/[:.]$/,""); notes=plain(bm[2]); }
    else{
      const p=plain(c);
      if(p.length>110){ const cut=p.slice(20,110).search(/[:;.] /); if(cut>=0){ title=p.slice(0,cut+20); notes=p.slice(cut+22); } else title=p; }
      else title=p;
    }
    const id=(body.match(/\[id: ([^\]]+)\]/)||[])[1]||null;
    const due=(body.match(/\[due: (\d{4}-\d{2}-\d{2})\]/)||[])[1]||null;
    // [event: date]: a date, not a job; it shows only in Coming up (Simon, 29 Oct 2026)
    const event=(body.match(/\[event: (\d{4}-\d{2}-\d{2})\]/)||[])[1]||null;
    const myday=(body.match(/\[today: (\d{4}-\d{2}-\d{2})\]/)||[])[1]||null;
    const added=(body.match(/\[added: (\d{4}-\d{2}-\d{2})\]/)||[])[1]||"";
    const waiting=(body.match(/\[waiting: (\d{4}-\d{2}-\d{2})\]/)||[])[1]||null;
    const reviewed=(body.match(/\[reviewed: (\d{4}-\d{2}-\d{2})\]/)||[])[1]||null;
    const started=(body.match(/\[started: (\d{4}-\d{2}-\d{2})\]/)||[])[1]||null;
    const off=(body.match(/\[off: (\d{4}-\d{2}-\d{2})\]/)||[])[1]||null;
    const list = tag;
    items.push({line:i, raw:ln, done:m[1]!==" ", group, sub, tag, list, title:title||"(untitled)", notes,
      links, id, due, event, myday, off, added, waiting, reviewed, started, star:/⭐/.test(body), quick:/\[quick\]/.test(body), ask:/\[ask\]/.test(body), after, contentRaw:content, restRaw:tm?body.slice(tm.index):"", bold:!!bm});
  });
  return items;
}

/* ---------- GitHub ---------- */
function api(path){ return "https://api.github.com/repos/"+settings.repo+"/contents/"+encodeURIComponent(settings.path).replace(/%2F/g,"/")+path; }
function hdrs(){ return {"Authorization":"Bearer "+settings.token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"}; }
function b64decode(b){ const bin=atob(b.replace(/\n/g,"")); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder("utf-8").decode(u); }
function b64encode(s){ const u=new TextEncoder().encode(s); let bin=""; for(let i=0;i<u.length;i+=8192) bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return btoa(bin); }
/* GitHub I/O. A network failure is marked so the change waits on the phone. */
function apiFor(path, q){ return "https://api.github.com/repos/"+settings.repo+"/contents/"+path.split("/").map(encodeURIComponent).join("/")+q; }
function netErr(){ const x=new Error("No connection: saved on the phone; it will sync"); x.network=true; return x; }
async function gh(url, opts){
  // A request left open when the Mac sleeps can hang for ever; give up after 20 s (Simon, 27 Oct 2026: the Mac app
  // stuck on Monday and refresh did nothing).
  const ac=new AbortController(), tm=setTimeout(()=>ac.abort(), 20000);
  let r; try{ r=await fetch(url, Object.assign({}, opts, {signal:ac.signal})); }catch(e){ clearTimeout(tm); throw netErr(); }
  clearTimeout(tm);
  if(r.status>=500) throw netErr();
  return r;
}
const ETAGKEY="dom-app-etag:";
async function fetchPath(path){
  if(window.DOM_TEST_IO) return window.DOM_TEST_IO.get(path);
  // Ask GitHub only whether the file has changed (ETag); a 304 costs nothing against the rate limit and
  // reuses the copy already on the device (quick, and light on mobile data).
  const memo=store(ETAGKEY+path);
  const h=hdrs(); if(memo && memo.etag) h["If-None-Match"]=memo.etag;
  const r=await gh(apiFor(path,"?ref="+encodeURIComponent(settings.branch)),{headers:h,cache:"no-store"});
  if(r.status===304 && memo) return {text:memo.text, sha:memo.sha};
  if(!r.ok){ const e=new Error(r.status===401?"The GitHub token isn't working. Check Settings.":r.status===404?"Can't find "+path+" in the repo. Check Settings.":"GitHub said "+r.status); e.status=r.status; throw e; }
  const j=await r.json();
  const out={text:b64decode(j.content), sha:j.sha};
  const et=r.headers.get("ETag"); if(et && out.text.length<1500000) store(ETAGKEY+path, {etag:et, text:out.text, sha:out.sha});
  return out;
}
async function fetchFile(){ return fetchPath(settings.path); }
async function putFile(text, sha, message){
  if(window.DOM_TEST_IO) return window.DOM_TEST_IO.put(settings.path, text, sha, message);
  const who={name:"Simon Jackson", email:"simonjackson1911@users.noreply.github.com"};
  const r=await gh(apiFor(settings.path,""),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},hdrs()),
    body:JSON.stringify({message, content:b64encode(text), sha, branch:settings.branch, committer:who, author:who})});
  if(!r.ok){ const e=new Error("Couldn't save ("+r.status+")"); e.status=r.status; throw e; }
  const j=await r.json();
  return j.content.sha;
}

/* Local state = the last copy from GitHub (base) with any changes still
   waiting to sync (pending) applied on top. Changes are saved on the phone
   first, then sent one at a time, in order, and retried when the signal
   comes back. */
const PKEY="dom-app-pending";
let pending = store(PKEY) || [];
function savePending(){ store(PKEY, pending); }
function recompute(){
  const L=(state.base||"").split("\n");
  for(const p of pending) applyOp(L, p.op);
  state.text=L.join("\n"); state.items=parse(state.text);
}
function setText(text, sha){
  state.base=text; state.sha=sha; state.fetched=Date.now();
  store(CKEY,{text, sha, fetched:state.fetched});
  recompute();
}
let loading=false;
async function refresh(quiet){
  if(!settings.token||!settings.repo){ if(!quiet) openSettings(); return; }
  if(loading) return; loading=true;

function locate(lines, m){

function applyOp(L, op){

  if(op.k==="del"){ const i=locate(L,op.m); if(i<0) return false; L.splice(i,1); return true; }
  if(op.k==="move"){ const i=locate(L,op.m); if(i<0) return false; let ln=L.splice(i,1)[0];

  pending.push({op, msg:"To-do app: "+msg, k:pk}); savePending();
  recompute(); if(route.view!=="cc") render(); pump();
  if(held.length) ccTell({op:"edits", list:held}); // the open page shows it now, not after the next sync

async function pump(){
  if(pumping || !pending.length || !settings.token || !settings.repo) return;
  pumping=true;

    while(pending.length){
      const p=pending[0];
      try{ await pushOne(p); pending.shift(); savePending(); ccHeldPushed(p.k); recompute(); render(); }
      catch(e){
        if(e.network){ clearTimeout(retryTimer); retryTimer=setTimeout(pump, 20000); break; }

async function pushOne(p){
  for(let attempt=0; attempt<3; attempt++){
    const f=await fetchFile();
    const L=f.text.split("\n");
    if(!applyOp(L, p.op)){ state.base=f.text; state.sha=f.sha; throw new Error("A task changed on the Mac before a change could save, so that change was skipped. Check the list."); }
    const text=L.join("\n");
    try{ const sha=await putFile(text, f.sha, p.msg); state.base=text; state.sha=sha; state.fetched=Date.now(); store(CKEY,{text, sha, fetched:state.fetched}); return; }

function groupRange(lines, group){
  const s=lines.findIndex(l=>l.trim()==="## "+group);

  let e=lines.findIndex((l,i)=>i>s && /^## /.test(l)); if(e<0) e=lines.length;
  return [s,e];

}
function insertTop(lines, group, tag, newLine){
  const r=groupRange(lines, group); if(!r) throw new Error("No "+group+" section in to-do.md");
  for(let i=r[0]+1;i<r[1];i++){ if(ITEM_RE.test(lines[i])){ const t=tagOf(lines[i]); if((t?t[1]:"none")===tag){ lines.splice(i,0,newLine); return; } } }

function insertUnder(lines, group, heading, newLine){

  if(h<0){ let at=r[1]; while(at>r[0]+1 && lines[at-1].trim()==="") at--; lines.splice(at,0,"","### "+heading,newLine); return; }
  let end=r[1]; for(let i=h+1;i<r[1];i++) if(/^#/.test(lines[i])){ end=i; break; }
  let last=h; for(let i=h+1;i<end;i++) if(ITEM_RE.test(lines[i])) last=i;

function placeLine(lines, group, item, ln){ insertInto(lines, asGroup(group), (item&&item.tag)||"none", ln); }
function retag(line, tag){

function rebuild(item, newTitle, newNotes){

/* ---------- Smart quick-add ----------

   (dates, "important", an area, now/next/later ("someday" means later), "waiting", "my day"),
   and stops at the first word it doesn't know. Everything before that is the
   title. So: say the task first, then the details. */
const WD=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const WDS={sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6};
const MON={jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};
const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,a:1};
const AREAW={"job search":"search","jobsearch":"search","search":"search","mohara":"MOHARA","ommani":"OMMANI","home":"personal","personal":"personal","vault":"system","dom":"system","mac":"files","files":"files"};
const GROUPW={now:"Now",next:"Next",later:"Later",someday:"Later"}; // no Someday since 29 Oct 2026

  const L=ws.length, w1=ws[L-1], w2=ws[L-2], w3=ws[L-3];

  if(L>=2){
    const two=w2+" "+w1;
    if(two in AREAW) return {n:2, kind:"tag", val:AREAW[two]};
    if(two==="my day") return {n:2, kind:"myday", val:true};
    if(two==="next week") return {n:2, kind:"due", val:nextWd(1, new Date().getDay()===1?7:0)};
    if(w2==="next" && wdOf(w1)>=0){ const mon=new Date().getDay()===1?7:(1-new Date().getDay()+7)%7; return {n:2, kind:"due", val:addDays(mon+((wdOf(w1)+6)%7))}; }
    if(w2==="this" && wdOf(w1)>=0) return {n:2, kind:"due", val:nextWd(wdOf(w1))};
    if(/^\d{1,2}(st|nd|rd|th)?$/.test(w2) && w1 in MON) return {n:2, kind:"due", val:dayMonth(parseInt(w2), MON[w1])};

    const m=matchEnd(ws.map(clean)); if(!m || ws.length-m.n<1) break;
    if(r[m.kind] && r[m.kind]!==false && m.kind!=="star") break;   // a second date or area: treat as part of the title

/* GitHub: the same token as the to-do repo (Simon, 24 Oct 2026: one token for both). */
function jrepo(){ return settings.journal || ((settings.repo||"simonjackson1911/x").split("/")[0]+"/journal-data"); }
async function jget(path, binary, etag){
  if(window.DOM_TEST_IO && window.DOM_TEST_IO.jget) return window.DOM_TEST_IO.jget(path, binary);

  const r=await gh("https://api.github.com/repos/"+jrepo()+"/contents/"+path.split("/").map(encodeURIComponent).join("/")+"?ref=main", {headers:h, cache:"no-store"});
  if(r.status===304) return {same:true};
  if(!r.ok){ const e=new Error(r.status===401 ? "The GitHub token isn't working. Check Settings."

      : "GitHub said "+r.status); e.status=r.status; throw e; }

}

function jSet(man, all){
  all.sort((a,b)=>(b.date+" "+b.time+" "+b.id).localeCompare(a.date+" "+a.time+" "+a.id));
  J.all=all; if(typeof jDelTidy==="function") jDelTidy(all);

  if(typeof jEditTidy==="function" && J.editOv){ jEditTidy(all); // edited on the phone: the new words at once, before the Mac writes them
    all=all.map(e=>J.editOv[e.id] ? Object.assign({}, e, {text:J.editOv[e.id].text, tags:J.editOv[e.id].tags}) : e); }

  // entries should be published immediately"); the filed copy replaces it once the index carries its phone id
  const filedP=new Set(all.map(e=>e.pid).filter(Boolean));

  if(mine.length){ all=all.concat(mine); all.sort((a,b)=>(b.date+" "+b.time+" "+b.id).localeCompare(a.date+" "+a.time+" "+a.id)); }

async function jLoad(){ // the phone's copy, at once

let jSyncing=null;
function jSync(){ // ask GitHub whether anything changed; fetch only the years whose hash moved
  if(jSyncing) return jSyncing;

    const old=await idbGet("manifest");

    J.at=Date.now();

function jInline(s){ return s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^\w*])\*(?!\s)(.+?)\*(?!\w)/g,"$1<i>$2</i>")

function jMd(text){
  const out=[]; let para=[];
  const flush=()=>{ if(para.length){ out.push("<p>"+para.join("<br>")+"</p>"); para=[]; } };
  for(const raw of String(text||"").split("\n")){
    const line=raw.replace(/\s+$/,""); let m;
    if(!line.trim()){ flush(); continue; }
    if((m=line.match(/^\s*(#{1,6})\s+(.*)$/))){ flush(); out.push('<h4 class="jh'+(m[1].length===1?" jh1":"")+'">'+jInline(esc(m[2]))+'</h4>'); continue; }

    if((m=line.match(/^\s*>\s?(.*)$/))){ flush(); out.push('<blockquote>'+jInline(esc(m[1]))+'</blockquote>'); continue; }

/* Calendar (Simon, 24 Oct 2026: "go back to a particular month or year, and see in blue which days have
   entries"). A month: the days written in blue, a day with a picture shows it. A year: twelve small months;
   tap the month's name to get there. */

  const y=+ym.slice(0,4), m=+ym.slice(5), days=new Date(y,m,0).getDate(), lead=(new Date(y,m-1,1).getDay()+6)%7;
  const shift=k=>{ const d=new Date(y,m-1+k,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
  const first=J.entries.length?J.entries[J.entries.length-1].date.slice(0,7):ym, lastMo=t.slice(0,7);
  const n=J.months[ym]||0;
  h+='<div class="jcalhead"><button class="iconbtn" data-j="go" data-h="#/j/cal/'+shift(-1)+'" aria-label="Previous month"'+(ym<=first?" disabled style=\"opacity:.3\"":"")+'>'+I.back+'</button>'+
    '<h3><a href="#/j/cal/'+y+'">'+jMonth(ym)+'</a><span>'+jN(n,"entry","entries")+(n?' on '+jN(Object.keys(J.byDate).filter(d=>d.slice(0,7)===ym).length,"day","days"):"")+' &middot; <a href="#/j/cal/'+y+'" style="color:var(--jct)">All of '+y+'</a></span></h3>'+
    '<button class="iconbtn" data-j="go" data-h="#/j/cal/'+shift(1)+'" aria-label="Next month"'+(ym>=lastMo?" disabled style=\"opacity:.3\"":"")+'>'+JI.next+'</button></div>';
  h+='<div class="jcal">'+["M","T","W","T","F","S","S"].map(d=>'<div class="wd">'+d+'</div>').join("");
  for(let i=0;i<lead;i++) h+='<span></span>';
  for(let d=1; d<=days; d++){ const key=ym+"-"+String(d).padStart(2,"0"), es=J.byDate[key]||[], pic=es.find(e=>e.images&&e.images.length);
    h+='<button data-j="day" data-d="'+key+'" class="'+(es.length?"has":"")+(pic?" pic":"")+(key===t?" today":"")+(key===J.sel?" sel":"")+'"'+(pic?' data-jbg="'+esc(pic.images[0])+'"':"")+(es.length?"":" disabled")+'>'+d+'</button>'; }
  h+='</div><div id="jdaylist" style="margin-top:14px">';

  return h+'</div></div>'+jFab();
}
function jYear(y){
  const t=today(), first=J.entries.length?+J.entries[J.entries.length-1].date.slice(0,4):y, last=+t.slice(0,4);

    '<h3>'+y+'<span>'+jN(tot,"entry","entries")+(tot?' on '+jN(dd,"day","days"):"")+'</span></h3>'+

/* Images: fetched once through the API (the repo is private, so no plain links), then kept on the phone. */
async function jImg(p){
  if(J.urls[p]) return J.urls[p];

  if(!b){ try{ b=(await jget(p, true)).blob; if(b) await idbSet("img:"+p, b); }catch(e){ return null; } }
  return b ? (J.urls[p]=URL.createObjectURL(b)) : null;
}

/* Write (#/j/new). Saved on the phone first (IndexedDB), then sent to journal-data's inbox/ when there's signal:
   the images first, the entry's JSON last, so the Mac only ever sees a whole entry. journal-sync on the iMac files
   it into the vault within a minute or two (personal/journal/README.md, "Dictated entries"); once the index carries
   its phone id, the phone's copy is dropped. Images are shrunk here (longest side 1,600 px, JPEG at 80%), which
   also strips the location and camera data. */
const JDRAFT="dom-app-jdraft";
J.draft={title:"", text:"", tags:[], images:[]}; J.queue=[]; J.allTags=false;
async function jShrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Couldn't read that image")); i.src=url; });
    const k=Math.min(1, 1600/Math.max(img.naturalWidth, img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.naturalWidth*k)); c.height=Math.max(1,Math.round(img.naturalHeight*k));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Couldn't shrink that image")), "image/jpeg", 0.8));
  } finally { URL.revokeObjectURL(url); }
}
function jB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }); }
async function jput(path, b64, msg){
  if(window.DOM_TEST_IO && window.DOM_TEST_IO.jput) return window.DOM_TEST_IO.jput(path, b64, msg);
  const who={name:"Simon Jackson", email:"simonjackson1911@users.noreply.github.com"};
  const r=await gh("https://api.github.com/repos/"+jrepo()+"/contents/"+path.split("/").map(encodeURIComponent).join("/"),
    {method:"PUT", headers:Object.assign({"Content-Type":"application/json"}, hdrs()), body:JSON.stringify({message:msg, content:b64, branch:"main", committer:who, author:who})});
  if(r.status===422) return; // already there from an earlier try that lost its answer
  if(!r.ok){ const e=new Error(r.status===404?"The journal isn't reachable yet: add journal-data to the token on GitHub":"Couldn't send ("+r.status+")"); e.status=r.status; throw e; }
}
async function jQueueLoad(){ J.queue=(await idbGet("jqueue"))||[]; }
async function jQueueSave(){ await idbSet("jqueue", J.queue); }
function jQueueTidy(){ // an entry the Mac has filed shows from the index; drop the phone's copy
  const filed=new Set(J.entries.filter(e=>!e.pending).map(e=>e.pid).filter(Boolean));
  const gone=J.queue.filter(q=>filed.has(q.pid));
  if(!gone.length) return;
  J.queue=J.queue.filter(q=>!filed.has(q.pid)); jQueueSave();
  gone.forEach(q=>{ for(let i=1;i<=q.n;i++) idbDel("jimg:"+q.pid+"-"+i); });
}
let jPumping=false;
async function jPump(){
  if(jPumping || !J.queue.some(q=>q.state==="waiting")) return;
  jPumping=true;
  try{
    for(const q of J.queue){
      if(q.state!=="waiting") continue;
      const imgs=[];
      for(let i=1;i<=q.n;i++){ const p="inbox/"+q.pid+"-"+i+".jpg"; imgs.push(p);
        if((q.sent||0)>=i) continue;
        const b=await idbGet("jimg:"+q.pid+"-"+i); if(!b) throw new Error("An image for the entry of "+q.date+" is missing on the phone");
        await jput(p, await jB64(b), "Journal: image from the phone"); q.sent=i; await jQueueSave(); }
      const body={v:1, pid:q.pid, date:q.date, time:q.time, text:q.text, tags:q.tags, images:imgs};
      await jput("inbox/"+q.pid+".json", b64encode(JSON.stringify(body, null, 1)), "Journal: entry from the phone");
      q.state="sent"; q.sentAt=Date.now(); delete q.err; await jQueueSave();
      if(route.view==="jn" && J.kind==="home") jRepaint();
    }
  }catch(e){ // the reason stays on the card, not just a toast (30 Oct 2026: an entry sat on the phone unseen)
    const q=J.queue.find(x=>x.state==="waiting"); if(q){ q.err=e.network?"No connection; it sends when there's signal":e.message; jQueueSave(); }
    if(!e.network) toast(e.message);
    if(route.view==="jn" && J.kind==="home") jRepaint(); }
  finally{ jPumping=false; }
}
function jQueueCard(){ // only what hasn't left the phone; a sent entry is in the timeline already (30 Oct 2026)
  const w=J.queue.filter(q=>q.state==="waiting");
  if(!w.length) return "";
  return '<div class="jcard"><div class="jlab">On the phone</div>'+w.map(q=>'<div class="jrow"><div class="jrb"><div class="jrd"><b>'+
    (q.state==="waiting"?(q.err?"Not sent yet":"Waiting for signal"):"Sent; the Mac files it within a minute or two")+'</b> &middot; '+esc(jDate(q.date))+" &middot; "+esc(q.time)+(q.n?" &middot; "+jN(q.n,"image","images"):"")+'</div>'+
    (q.state==="waiting"&&q.err?'<div class="jrs" style="color:#c92a2a">'+esc(q.err)+'</div>':'')+
    '<div class="jrs">'+esc(jPlain(q.text).slice(0,240)||"(image)")+'</div></div></div>').join("")+
    (J.queue.some(q=>q.state==="waiting")?'<button class="btn" data-j="send" style="margin:6px 0 4px">Send now</button>':'')+'</div>';
}
/* Pins from the phone: shown at once (J.pinOv), sent as pins/<id>--<ms>.json; journal-sync writes pinned: true
   into the note, or takes it out, last tap wins. Once the index agrees, the phone's override goes. */
J.pinOv={}; J.pinQ=[];
async function jPinLoad(){ const v=await idbGet("jpins"); if(v){ J.pinOv=v.ov||{}; J.pinQ=v.q||[]; } }
function jPinSave(){ return idbSet("jpins", {ov:J.pinOv, q:J.pinQ}); }
function jPinTidy(){
  let ch=false;
  for(const id of Object.keys(J.pinOv)){ const e=J.byId[id];
    if((!e || !!e.pinned===J.pinOv[id]) && !J.pinQ.some(q=>q.id===id)){ delete J.pinOv[id]; ch=true; } }
  if(ch) jPinSave();
}
async function jPin(id){
  const e=J.byId[id]; if(!e) return;
  const on=!jPinned(e); J.pinOv[id]=on; J.pinQ.push({id, pinned:on, at:Date.now()}); await jPinSave();
  jRepaint(); toast(on?"Pinned":"Unpinned"); jPinPump();
}
let jPinning=false;
async function jPinPump(){
  if(jPinning || !J.pinQ.length) return;
  jPinning=true;
  try{ while(J.pinQ.length){ const q=J.pinQ[0];
      await jput("pins/"+q.id+"--"+q.at+".json", b64encode(JSON.stringify({v:1, id:q.id, pinned:q.pinned, at:q.at})), (q.pinned?"Journal: pin ":"Journal: unpin ")+q.id);
      J.pinQ.shift(); await jPinSave(); } }
  catch(e){ if(!e.network) toast(e.message); }
  finally{ jPinning=false; }
}
jPinLoad().then(()=>{ if(J.pinQ.length) jPinPump(); });
window.addEventListener("online", ()=>jPinPump());

/* Delete from the phone (Simon, 24 Oct 2026: "add a delete option"; to-do dom-journal-delete: at the foot of the entry,
   with a confirm; the iMac removes the note and its images from the vault on its next run, git keeps a copy). After the confirm the entry goes from the phone at
   once (J.delOv) and a request naming it is sent as deletes/<id>--<ms>.json; journal-sync removes that note, and any
   image only it links to, from personal/journal/, commits, and clears the request. Once the index no longer carries
   the entry, the phone's marker goes; if the Mac still has it two days on (it refused), the entry shows again. */
J.delOv={}; J.delQ=[];
async function jDelLoad(){ const v=await idbGet("jdels"); if(v){ J.delOv=v.ov||{}; J.delQ=v.q||[]; } }
function jDelSave(){ return idbSet("jdels", {ov:J.delOv, q:J.delQ}); }
function jDelTidy(all){
  const ids=new Set(all.map(e=>e.id)); let ch=false;
  for(const id of Object.keys(J.delOv)){ if(J.delQ.some(q=>q.id===id)) continue;
    if(!ids.has(id) || Date.now()-J.delOv[id]>2*864e5){ delete J.delOv[id]; ch=true; } }
  if(ch) jDelSave();
}
async function jDelete(id){
  const e=J.byId[id]; if(!e) return;
  if(!confirm("Delete this entry?\n\n"+jDate(e.date,true)+(e.time?", "+e.time:"")+"\n\nThe Mac removes it from the vault within a minute or two; git keeps a copy.")) return;
  const at=Date.now(); J.delOv[id]=at; J.delQ.push({id, at}); await jDelSave();
  jSet(J.manifest, J.all||J.entries);
  (e.images||[]).forEach(p=>{ idbDel("img:"+p); if(J.urls[p]){ URL.revokeObjectURL(J.urls[p]); delete J.urls[p]; } });
  location.replace(J.back && J.back.indexOf("#/j")===0 ? J.back : "#/j"); toast("Deleted: the Mac takes it out of the vault within a minute or two");
  jDelPump();
}
let jDeling=false;
async function jDelPump(){
  if(jDeling || !J.delQ.length) return;
  jDeling=true;
  try{ while(J.delQ.length){ const q=J.delQ[0];
      await jput("deletes/"+q.id+"--"+q.at+".json", b64encode(JSON.stringify({v:1, id:q.id, at:q.at})), "Journal: delete "+q.id);
      J.delQ.shift(); await jDelSave(); } }
  catch(e){ if(!e.network) toast(e.message); }
  finally{ jDeling=false; }
}
J.delReady=jDelLoad().then(()=>{ if(J.delQ.length) jDelPump(); });
window.addEventListener("online", ()=>jDelPump());

/* Edit from the phone (Simon, 30 Oct 2026: "you can't edit a previous day's journal"). Text and tags only; images
   stay as they are. The new words show at once (J.editOv) and an edit naming the entry is sent as
   edits/<id>--<ms>.json; journal-sync writes them into the note, keeping its date, images and "The day", and git
   keeps the old words. Once the index carries the new text, the phone's override goes. */
J.editOv={}; J.editQ=[]; J.edraft=null;
function jEditNorm(t){ return String(t||"").replace(/\r\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim(); }
async function jEditLoad(){ const v=await idbGet("jedits"); if(v){ J.editOv=v.ov||{}; J.editQ=v.q||[]; } }
function jEditSave2(){ return idbSet("jedits", {ov:J.editOv, q:J.editQ}); }
function jEditTidy(all){
  let ch=false; const by={}; all.forEach(e=>by[e.id]=e);
  for(const id of Object.keys(J.editOv)){ if(J.editQ.some(q=>q.id===id)) continue;
    const e=by[id], o=J.editOv[id];
    if(!e || jEditNorm(e.text)===o.text || Date.now()-o.at>2*864e5){ delete J.editOv[id]; ch=true; } }
  if(ch) jEditSave2();
}
function jEditView(id){
  const e=J.byId[id];
  if(!e) return jTop("Edit", "#/j", "Journal", "")+'<div class="jwrap"><p class="help">That entry isn\'t on the phone yet.</p></div>';
  if(!J.edraft || J.edraft.id!==id){ const sp=jSplit(e.text); J.edraft={id, title:sp[0], text:sp[1], tags:(e.tags||[]).slice()}; }
  const d=J.edraft;
  let h=jTop("Edit entry", "#/j/"+encodeURIComponent(id), "Entry", "")+'<div class="jwrap">';
  h+='<div class="jwdate">'+esc(jDate(e.date,true))+(e.time?", "+esc(e.time):"")+'</div>';
  h+='<input id="je-title" class="jwtitle" placeholder="Title" autocapitalize="sentences" value="'+esc(d.title||"")+'">';
  h+=jFmtBar("je-text");
  h+='<textarea id="je-text" class="jwtext" autocapitalize="sentences">'+esc(d.text)+'</textarea>';
  if((e.images||[]).length) h+='<p class="help" style="margin:6px 2px 10px">'+jN(e.images.length,"image stays","images stay")+' as '+(e.images.length===1?"it is":"they are")+'.</p>';
  const all=(J.manifest && J.manifest.tags || []).map(x=>x[0]);
  const shown=all.slice(0,12).concat(d.tags.filter(t=>all.slice(0,12).indexOf(t)<0));
  h+='<div class="jlab">Tags</div><div class="jtags">'+shown.map(t=>'<a href="#" class="qa-chip'+(d.tags.indexOf(t)>=0?" on":"")+'" data-j="etag" data-t="'+esc(t)+'">'+esc(t)+'</a>').join("")+'</div>';
  h+='<button class="btn" data-j="esave">Save</button></div>';
  return h;
}
async function jEditSave(){
  const d=J.edraft; if(!d) return;
  const text=jEditNorm(jJoin(($("je-title")||{}).value ?? d.title, ($("je-text")||{}).value ?? d.text)), e=J.byId[d.id];
  if(!text){ toast("An entry can't be empty: use Delete instead"); return; }
  if(e && text===jEditNorm(e.text) && d.tags.join("|")===(e.tags||[]).join("|")){ location.replace("#/j/"+encodeURIComponent(d.id)); return; }
  const at=Date.now(), tags=d.tags.slice();
  J.editOv[d.id]={text, tags, at}; J.editQ.push({id:d.id, text, tags, at}); await jEditSave2();
  jSet(J.manifest, J.all||J.entries); J.edraft=null;
  location.replace("#/j/"+encodeURIComponent(d.id)); toast("Saved; the Mac writes it into the vault within a minute or two");
  jEditPump();
}
let jEditing=false;
async function jEditPump(){
  if(jEditing || !J.editQ.length) return;
  jEditing=true;
  try{ while(J.editQ.length){ const q=J.editQ[0];
      await jput("edits/"+q.id+"--"+q.at+".json", b64encode(JSON.stringify({v:1, id:q.id, text:q.text, tags:q.tags, at:q.at})), "Journal: edit "+q.id);
      J.editQ.shift(); await jEditSave2(); } }
  catch(e){ if(!e.network) toast(e.message); }
  finally{ jEditing=false; }
}
J.editReady=jEditLoad().then(()=>{ if(J.editQ.length) jEditPump(); });
window.addEventListener("online", ()=>jEditPump());
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) jEditPump(); });

function jFmtBar(id){ return '<div class="jfmts" data-for="'+id+'">'+[["","Body"],["# ","Title"],["## ","Subtitle"],["- ","List"],["> ","Quote"]].map(x=>'<button type="button" class="jfmt" data-jf="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>'; }
/* The line the cursor is on becomes a Title, Subtitle, List item or Quote (Simon, 30 Oct 2026, after Day One's menu);
   the same button again takes it off. Markdown markers, so the vault note stays plain text. pointerdown, not click,
   so the text box keeps its cursor and the keyboard stays up. */
document.addEventListener("pointerdown", e=>{
  const b=e.target.closest(".jfmt"); if(!b) return;
  e.preventDefault();
  const ta=$(b.parentElement.dataset.for); if(!ta) return;
  const v=ta.value, pos=ta.selectionStart||0, a=v.lastIndexOf("\n", pos-1)+1, z=v.indexOf("\n", pos)<0 ? v.length : v.indexOf("\n", pos);
  const line=v.slice(a,z), mk=b.dataset.jf, cur=(line.match(/^(#{1,6}\s+|[-*\u2022]\s+|>\s?)/)||[""])[0];
  const same=!!mk && cur.trim()===mk.trim(), next=(same?"":mk)+line.slice(cur.length);
  ta.value=v.slice(0,a)+next+v.slice(z);
  const np=Math.max(a, pos+(next.length-line.length)); ta.focus(); ta.setSelectionRange(np, np);
  ta.dispatchEvent(new Event("input",{bubbles:true}));
});

function jWrite(){
  const d=J.draft;
  let h=jTop("New entry", "#/j", "Journal", "")+'<div class="jwrap">';
  h+='<div class="jwdate">'+esc(jDate(today(),true))+'</div>';
  h+='<input id="jw-title" class="jwtitle" placeholder="Title" autocapitalize="sentences" value="'+esc(d.title||"")+'">';
  h+=jFmtBar("jw-text");
  h+='<textarea id="jw-text" class="jwtext" placeholder="Speak or type" autocapitalize="sentences">'+esc(d.text)+'</textarea>';
  h+='<div class="jwimgs">'+d.images.map((im,i)=>'<span class="jwimg"><img src="'+im.url+'" alt=""><button data-j="unimg" data-i="'+i+'" aria-label="Remove image">&times;</button></span>').join("")+'</div>';
  h+='<label class="btn ghost jwadd">Add image<input id="jw-file" type="file" accept="image/*" multiple></label>';
  h+='<p class="help" style="margin:6px 2px 14px">Screenshots and photos, several at once. No bank or card screens.</p>';
  const all=(J.manifest && J.manifest.tags || []).map(x=>x[0]);
  const shown=J.allTags ? all : all.slice(0,12).concat(d.tags.filter(t=>all.slice(0,12).indexOf(t)<0));
  h+='<div class="jlab">Tags</div><div class="jtags">'+shown.map(t=>'<a href="#" class="qa-chip'+(d.tags.indexOf(t)>=0?" on":"")+'" data-j="wtag" data-t="'+esc(t)+'">'+esc(t)+'</a>').join("")+
    (all.length>12?'<a href="#" class="qa-chip" data-j="alltags">'+(J.allTags?"Fewer":"All "+all.length+" tags")+'</a>':"")+'</div>';
  h+='<button class="btn" data-j="save">Save</button></div>';
  return h;
}
function jDraftKeep(){ try{ localStorage.setItem(JDRAFT, JSON.stringify({title:J.draft.title||"", text:J.draft.text, tags:J.draft.tags})); }catch(e){} }
(function(){ try{ const d=JSON.parse(localStorage.getItem(JDRAFT)||"null"); if(d){ J.draft.title=d.title||""; J.draft.text=d.text||""; J.draft.tags=d.tags||[]; } }catch(e){} })();
async function jAddFiles(files){
  for(const f of files){ try{ const b=await jShrink(f); J.draft.images.push({blob:b, url:URL.createObjectURL(b)}); }catch(e){ toast(e.message); } }
  jRepaint();
}
async function jSave(){
  const d=J.draft, text=jJoin(($("jw-title")||{}).value||d.title, ($("jw-text")||{}).value||d.text||"");
  if(!text.trim() && !d.images.length){ toast("Nothing to save yet"); return; }
  const now=new Date(), hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const pid="p"+iso(now).replace(/-/g,"")+"-"+hm.replace(":","")+String(now.getSeconds()).padStart(2,"0")+"-"+Math.random().toString(36).slice(2,6);
  for(let i=0;i<d.images.length;i++) await idbSet("jimg:"+pid+"-"+(i+1), d.images[i].blob);
  J.queue.push({pid, date:iso(now), time:hm, text, tags:d.tags.slice(), n:d.images.length, state:"waiting", at:Date.now()});
  await jQueueSave();
  d.images.forEach(im=>URL.revokeObjectURL(im.url));
  J.draft={title:"", text:"", tags:[], images:[]}; try{ localStorage.removeItem(JDRAFT); }catch(e){}
  if(J.loaded) jSet(J.manifest, J.all||J.entries);
  location.hash="#/j"; toast("Saved");
  jPump();
}
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-j]"); if(!b) return;
  const a=b.dataset.j;
  if(a==="write"){ location.hash="#/j/new"; }
  else if(a==="send"){ toast("Sending"); jPump(); }
  else if(a==="save"){ jSave(); }
  else if(a==="edit"){ location.hash="#/j/edit/"+encodeURIComponent(b.dataset.id); }
  else if(a==="esave"){ jEditSave(); }
  else if(a==="etag"){ e.preventDefault(); const t=b.dataset.t, i=J.edraft.tags.indexOf(t); if(i>=0) J.edraft.tags.splice(i,1); else J.edraft.tags.push(t); b.classList.toggle("on", i<0); }
  else if(a==="unimg"){ const im=J.draft.images.splice(+b.dataset.i,1)[0]; if(im) URL.revokeObjectURL(im.url); jRepaint(); }
  else if(a==="wtag"){ e.preventDefault(); const t=b.dataset.t, i=J.draft.tags.indexOf(t); if(i>=0) J.draft.tags.splice(i,1); else J.draft.tags.push(t); jDraftKeep(); b.classList.toggle("on", i<0); }
  else if(a==="alltags"){ e.preventDefault(); J.allTags=!J.allTags; jRepaint(); }
});
document.addEventListener("input", e=>{ if(e.target.id==="jw-text"){ J.draft.text=e.target.value; jDraftKeep(); }
  if(e.target.id==="jw-title"){ J.draft.title=e.target.value; jDraftKeep(); }
  if(e.target.id==="je-title" && J.edraft) J.edraft.title=e.target.value; if(e.target.id==="je-text" && J.edraft) J.edraft.text=e.target.value; });
document.addEventListener("change", e=>{ if(e.target.id==="jw-file" && e.target.files.length) jAddFiles([...e.target.files]); });
window.addEventListener("online", ()=>jPump());
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) jPump(); });
J.qReady=jQueueLoad().then(()=>{ if(J.queue.length) jPump(); });

/* ---------- Start ---------- */
const cached=store(CKEY);
if(cached && cached.text){ state.base=cached.text; state.sha=cached.sha; state.fetched=cached.fetched||0; recompute(); }
// The app opens on the Control Centre (Simon, 17 Oct 2026); "Lists" at the top goes to the lists.
// A fresh open always lands there, not on the last paper the browser remembers (Simon, 25 Oct 2026:
// it reopened on the Centrica guide after a restart). A reload in the same tab keeps the page.
try{ if(!sessionStorage.getItem("dom-open")){ sessionStorage.setItem("dom-open","1"); if(location.hash && location.hash!=="#/") history.replaceState(null,"","#/"); } }catch(e){}
if(settings.token && settings.repo) Dom.route();
else { route={view:"cc"}; ccPage="Priorities/control-centre.html"; show("cc"); renderCC(false); openSettings(); }
refresh();
checkUpdate();
if(settings.token && settings.repo && !store(GUIDEKEY)) setTimeout(openGuide, 1200);
</script>
